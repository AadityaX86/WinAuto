name: User journey

# Uses WinAuto like a new user on a real Windows machine: instant commands,
# launcher results, and the built-in AI (Qwen3-VL 4B on the CPU). Run it from
# Actions → User journey → Run workflow; read the results in the job log.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/journey.yml", "scripts/user_journey.py"]

jobs:
  journey:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      WINAUTO_AI_DIR: ${{ github.workspace }}\.ai-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse the downloaded engine and model
        uses: actions/cache@v4
        with:
          path: .ai-cache
          key: journey-ai-${{ hashFiles('winauto/adapters/local_ai/catalog.py') }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Walk through WinAuto
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/user_journey.py --ai
