name: Probe (temporary)

# Temporary: checks the pinned llama.cpp build with the Qwen3-VL model WinAuto
# will download. Removed before merging.

on:
  push:
    branches: [claude/awesome-darwin-0dcwv6]
    paths: [.github/workflows/probe.yml]

jobs:
  qwen3-vl:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download engine and model
        shell: pwsh
        run: |
          curl.exe -sSL -o engine.zip https://github.com/ggml-org/llama.cpp/releases/download/b11857/llama-b11857-bin-win-vulkan-x64.zip
          Expand-Archive engine.zip -DestinationPath engine
          $t = Measure-Command {
            curl.exe -sSL -o model.gguf https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf
            curl.exe -sSL -o mmproj.gguf https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
          }
          "download took {0:N0} s" -f $t.TotalSeconds
          (Get-FileHash model.gguf -Algorithm SHA256).Hash.ToLower()
          (Get-FileHash mmproj.gguf -Algorithm SHA256).Hash.ToLower()
          (Get-FileHash engine.zip -Algorithm SHA256).Hash.ToLower()

      - name: Start the server, call tools, stream, read an image (one step: the server dies with its step)
        shell: pwsh
        run: |
          $args = "-m model.gguf --mmproj mmproj.gguf --host 127.0.0.1 --port 8765 -c 8192 -np 1 --jinja --reasoning-budget 0 --fit on --api-key secret --alias winauto"
          Start-Process engine\llama-server.exe -ArgumentList $args -RedirectStandardError server.log -RedirectStandardOutput server.out -NoNewWindow
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 2
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/health; if ($h.status -eq "ok") { "ready after {0} s" -f ($i * 2); break } } catch {}
          }
          Get-Content server.log | Select-String -Pattern "fit|offload|layers|mmproj|error|warn|n_ctx|listening" | Select-Object -First 40

          $hdr = @{ Authorization = "Bearer secret" }
          $tools = @(@{ type = "function"; function = @{ name = "set_volume"; description = "Set the PC's volume"; parameters = @{ type = "object"; properties = @{ level = @{ type = "integer"; description = "0-100" } }; required = @("level") } } },
                     @{ type = "function"; function = @{ name = "add_todo"; description = "Add a todo"; parameters = @{ type = "object"; properties = @{ task = @{ type = "string" }; due = @{ type = "string" } }; required = @("task") } } })
          $body = @{ model = "winauto"; stream = $false; messages = @(@{ role = "system"; content = "You are WinAuto, a Windows assistant. Use tools." }, @{ role = "user"; content = "remind me to buy milk tomorrow and turn the volume down to 20" }); tools = $tools } | ConvertTo-Json -Depth 12
          $t = Measure-Command { $r = Invoke-RestMethod http://127.0.0.1:8765/v1/chat/completions -Method Post -Body $body -ContentType "application/json" -Headers $hdr }
          "non-streaming took {0:N1} s" -f $t.TotalSeconds
          $r.choices[0] | ConvertTo-Json -Depth 10
          try { Invoke-RestMethod http://127.0.0.1:8765/v1/models; "UNAUTHORISED CALL WORKED" } catch { "unauthorised call refused: $($_.Exception.Response.StatusCode)" }
          $body2 = @{ model = "winauto"; stream = $true; messages = @(@{ role = "user"; content = "Set the volume to 35." }); tools = $tools } | ConvertTo-Json -Depth 12
          $raw = Invoke-WebRequest http://127.0.0.1:8765/v1/chat/completions -Method Post -Body $body2 -ContentType "application/json" -Headers $hdr
          "--- streamed (first 25 lines)"
          ($raw.Content -split "`n" | Where-Object { $_ } | Select-Object -First 25) -join "`n"

          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 640, 240
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font "Arial", 40
          $g.DrawString("Error 0x80070005", $font, [System.Drawing.Brushes]::Black, 20, 40)
          $g.DrawString("Access is denied", $font, [System.Drawing.Brushes]::Black, 20, 120)
          $ms = New-Object System.IO.MemoryStream
          $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          $hdr = @{ Authorization = "Bearer secret" }
          $content = @(@{ type = "text"; text = "What does the error on this screenshot mean? Quote the text first." }, @{ type = "image_url"; image_url = @{ url = "data:image/png;base64,$b64" } })
          $body = @{ model = "winauto"; stream = $false; messages = @(@{ role = "user"; content = $content }) } | ConvertTo-Json -Depth 12
          $t = Measure-Command { $r = Invoke-RestMethod http://127.0.0.1:8765/v1/chat/completions -Method Post -Body $body -ContentType "application/json" -Headers $hdr }
          "vision took {0:N1} s" -f $t.TotalSeconds
          $r.choices[0].message.content
          Get-Content server.log -Tail 15
