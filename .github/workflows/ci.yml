name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        if: runner.os == 'Linux'
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q

  engine:
    name: Built-in AI (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      WINAUTO_ENGINE_TEST: "1"
      WINAUTO_ENGINE_DIR: ${{ github.workspace }}/.engine-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse downloaded engine and test model
        uses: actions/cache@v4
        with:
          path: .engine-cache
          key: engine-${{ runner.os }}-${{ hashFiles('winauto/adapters/local_ai/catalog.py') }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Download, start and use the real engine
        run: python -m pytest -q -s tests/test_engine_live.py

  build:
    name: Build WinAuto.exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # Not editable (-e): PyInstaller can't follow editable installs.
        run: python -m pip install ".[dev]"
      - name: Make icon
        run: python packaging/make_icon.py
      - name: Package and self-test
        uses: ./.github/actions/build-exe
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WinAuto-windows
          path: dist/WinAuto
          retention-days: 30
