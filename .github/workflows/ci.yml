name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build WinAuto.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Make icon
        run: python packaging/make_icon.py
      - name: Package
        run: >
          pyinstaller --noconfirm --clean --windowed --name WinAuto
          --icon packaging/winauto.ico
          --collect-submodules winauto
          --collect-submodules keyring
          --collect-submodules win32ctypes
          --hidden-import pycaw.pycaw
          --hidden-import comtypes.stream
          packaging/launcher.py
      - name: Self-test the packaged app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\WinAuto\WinAuto.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-ChildItem $env:TEMP -Filter "winauto-selftest-*" | Sort-Object LastWriteTime | Select-Object -Last 1 |
            ForEach-Object { Get-Content (Join-Path $_.FullName "selftest.txt") }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WinAuto-windows
          path: dist/WinAuto
          retention-days: 30
